server:
  port: 8080



spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  type: com.alibaba.druid.pool.DruidDataSource
  datasource:
    business:
      driver-class-name: ${cyj.datasource.driver-class-name}
      url: jdbc:mysql://${cyj.datasource.host}:${cyj.datasource.port}/${cyj.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${cyj.datasource.username}
      password: ${cyj.datasource.password}
    quartz:
      # Quartz 数据源配置
      driver-class-name: ${cyj.datasource.driver-class-name}
      url: jdbc:mysql://localhost:3306/xx_forum_quartz?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${cyj.datasource.username}
      password: ${cyj.datasource.password}
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000


  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  quartz:
    # Quartz配置
    job-store-type: jdbc
    jdbc:
      initialize-schema: never



  data:
    redis:
      host: localhost
      port: 6379
#      password:
      database: 0
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-wait: -1ms
          max-active: 16

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cyj.xx.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # SQL 格式化配置
    local-cache-scope: session
    call-setters-on-nulls: true
    # 启用 SQL 美化
    sql-pretty: true

logging:
  level:
    com.cyj.xx.mapper: trace
    java.sql: debug
    org.springframework.messaging.simp: TRACE
    org.springframework.web.socket: TRACE
    org.springframework.web.socket.handler: TRACE
    org.springframework.boot.autoconfigure.quartz: DEBUG
    org.quartz: info


cyj:
  jwt:
    secret: "jycyj"
    exptime: 72000000
    token: "token"


